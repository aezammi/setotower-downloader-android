name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: github
            task: assembleGithubRelease
            display_name: github
          - flavor: foss
            task: assembleFossRelease
            display_name: FOSS
          - flavor: izzy
            task: assembleIzzyRelease
            display_name: Izzy

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Configure Keystore & Properties
        run: |
          touch local.properties
          if [ -n "${{ secrets.BASE_64_SIGNING_KEY }}" ] && [ -n "${{ secrets.LOCAL_PROPERTIES }}" ]; then
            echo "${{ secrets.BASE_64_SIGNING_KEY }}" | base64 -d > app/release_keystore.jks
            printf '%s\n' "${{ secrets.LOCAL_PROPERTIES }}" > keystore.properties
          else
            echo "No private signing configuration supplied; using Android debug keystore for public CI artifacts."
          fi
          chmod +x gradlew

      - name: Require private signing for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          SIGNING_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PROPERTIES" || {
            echo 'Version-tag builds require production signing secrets.' >&2
            exit 1
          }

      # Build ONLY the specific flavor assigned to this matrix runner
      - name: Build ${{ matrix.flavor }} APK release
        run: ./gradlew --no-daemon --max-workers=2 ${{ matrix.task }} --warning-mode all

      # Upload individual ABI artifacts for this runner's flavor
      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: setotower-downloader-autogenerated-arm64-v8a-${{ matrix.flavor }}-release
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/release/*arm64*.apk

      - name: Upload armeabiv7
        uses: actions/upload-artifact@v4
        with:
          name: setotower-downloader-autogenerated-armeabi-v7a-${{ matrix.flavor }}-release
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/release/*armeabi*.apk

      - name: Upload universal
        uses: actions/upload-artifact@v4
        with:
          name: setotower-downloader-autogenerated-universal-${{ matrix.flavor }}-release
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/release/*universal*.apk

      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: setotower-downloader-autogenerated-x86-${{ matrix.flavor }}-release
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/release/*x86-*.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: setotower-downloader-autogenerated-x86_64-${{ matrix.flavor }}-release
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/release/*x86_64*.apk

      - name: Upload Full Folder
        uses: actions/upload-artifact@v4
        with:
          name: Setotower Downloader APK release ${{ matrix.display_name }} generated
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/release/
