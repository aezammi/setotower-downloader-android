name: Android instrumentation smoke

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  connected-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Prepare Gradle
        run: |
          touch local.properties
          chmod +x gradlew

      - name: Run connected Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest --warning-mode all
