name: Android instrumentation smoke

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  connected-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Prepare Gradle
        run: |
          touch local.properties
          chmod +x gradlew

      - name: Run connected Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          script: |
            for attempt in 1 2; do
              echo "Connected smoke attempt ${attempt}/2"
              if ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest --warning-mode all; then
                exit 0
              fi
              echo "Smoke attempt ${attempt} failed; restarting the emulator before retry"
              adb reboot || true
              sleep 12
            done
            exit 1
